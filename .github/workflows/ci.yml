name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install AMMPER (editable) with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

      - name: Smoke test — run a real tutorial simulation end to end
        run: ammper quickstart --name "ci_smoke_${{ matrix.os }}_${{ matrix.python-version }}"

  wheel-smoke:
    name: installed wheel (no clone) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install it into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheelenv"
          if [ -d "$RUNNER_TEMP/wheelenv/Scripts" ]; then BIN=Scripts; else BIN=bin; fi
          "$RUNNER_TEMP/wheelenv/$BIN/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheelenv/$BIN/pip" install dist/*.whl

      - name: setup, quickstart and the GUI, run from outside the repository
        env:
          AMMPER_HOME: ${{ runner.temp }}/ammper-home
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ -d "$RUNNER_TEMP/wheelenv/Scripts" ]; then BIN=Scripts; else BIN=bin; fi
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheelenv/$BIN/ammper" setup
          "$RUNNER_TEMP/wheelenv/$BIN/ammper" quickstart --name wheel_smoke
          "$RUNNER_TEMP/wheelenv/$BIN/python" -c "
          from PyQt5.QtWidgets import QApplication, QLabel
          app = QApplication([])
          from ammper.gui import AMMPERGUI
          w = AMMPERGUI.Widget()
          pics = [l for l in w.findChildren(QLabel) if l.pixmap() is not None]
          assert pics and not any(l.pixmap().isNull() for l in pics), 'GUI images failed to load'
          print('GUI constructed with', len(pics), 'images loaded')
          "
